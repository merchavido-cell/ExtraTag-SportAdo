<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SportAdo - Activity</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
            background: #0f172a; color: #f8fafc; overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .activity-app {
            display: flex; flex-direction: column;
            width: 100%; height: 100vh; height: 100dvh;
            padding-top: env(safe-area-inset-top, 0px);
        }

        .top-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px; background: #131c31;
            border-bottom: 1px solid #1e293b; flex-shrink: 0;
            min-height: 56px;
        }

        .back-btn {
            background: transparent; border: none; color: #94a3b8;
            font-size: 20px; cursor: pointer; padding: 6px 12px;
            border-radius: 8px; font-family: inherit;
        }
        .back-btn:active { background: #1e293b; color: #f8fafc; }

        .sport-title {
            font-size: 16px; font-weight: 700; color: #f8fafc;
            letter-spacing: 0.5px; text-transform: uppercase;
        }

        .timer-display {
            font-size: 15px; font-weight: 700; color: #38bdf8;
            font-variant-numeric: tabular-nums;
            font-family: 'Courier New', monospace;
        }

        #map {
            flex: 1; min-height: 0; width: 100%;
            background: #1a2540; position: relative;
        }

        .stats-panel {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 1px; background: #1e293b; flex-shrink: 0;
        }

        .stat-box { background: #131c31; padding: 14px 8px; text-align: center; }

        .stat-value {
            font-size: 22px; font-weight: 700; color: #38bdf8;
            font-variant-numeric: tabular-nums; line-height: 1.1;
            font-family: 'Courier New', monospace;
        }
        .stat-unit {
            font-size: 11px; color: #64748b; font-weight: 500;
            margin-top: 3px; letter-spacing: 0.5px; text-transform: uppercase;
        }

        .controls {
            display: flex; gap: 10px; padding: 14px 16px;
            padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
            background: #0f172a; flex-shrink: 0;
        }

        .btn {
            flex: 1; padding: 18px 12px; border-radius: 14px;
            border: none; font-size: 15px; font-weight: 700;
            cursor: pointer; font-family: inherit;
            letter-spacing: 0.5px; text-transform: uppercase;
            transition: all 0.15s ease;
        }
        .btn:active { transform: scale(0.97); }

        .btn-start { background: #22c55e; color: #052e16; }
        .btn-pause { background: #f59e0b; color: #451a03; }
        .btn-stop  { background: #ef4444; color: #450a0a; }
        .btn-save  { background: #38bdf8; color: #0c2d48; }

        .toast {
            position: fixed; bottom: 100px; left: 50%;
            transform: translateX(-50%);
            background: #1e293b; color: #f8fafc;
            padding: 12px 20px; border-radius: 10px;
            border: 1px solid #334155;
            font-size: 13px; font-weight: 500;
            z-index: 9999; display: none; max-width: 85%;
            text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        }

        .status-badge {
            position: absolute; top: 16px; left: 16px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #334155; border-radius: 20px;
            padding: 6px 14px; font-size: 11px; font-weight: 600;
            color: #94a3b8; letter-spacing: 0.5px;
            text-transform: uppercase; z-index: 999;
            backdrop-filter: blur(8px);
            display: flex; align-items: center; gap: 6px;
        }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #64748b;
        }
        .status-dot.active { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
        .status-dot.paused { background: #f59e0b; }
        .status-dot.done   { background: #38bdf8; }
    </style>
</head>
<body>

<div class="activity-app">

    <header class="top-bar">
        <button class="back-btn" onclick="goBack()">←</button>
        <span class="sport-title" id="sportTitle">Activity</span>
        <span class="timer-display" id="timerDisplay">00:00:00</span>
    </header>

    <div id="map">
        <div class="status-badge">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Ready</span>
        </div>
    </div>

    <div class="stats-panel">
        <div class="stat-box">
            <div class="stat-value" id="statDistance">0.00</div>
            <div class="stat-unit">km</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" id="statSpeed">0.0</div>
            <div class="stat-unit">km/h</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" id="statCalories">0</div>
            <div class="stat-unit">cal</div>
        </div>
    </div>

    <div class="controls">
        <button class="btn btn-start" id="btnStart" onclick="startRecording()">Start</button>
        <button class="btn btn-pause" id="btnPause" onclick="togglePause()" style="display:none;">Pause</button>
        <button class="btn btn-stop"  id="btnStop"  onclick="stopRecording()" style="display:none;">Stop</button>
        <button class="btn btn-save"  id="btnSave"  onclick="saveActivity()" style="display:none;">Save</button>
    </div>

</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/sportado-bridge.js"></script>
<script src="js/sportado-gps.js"></script>
<script src="js/sportado-map.js"></script>
<script src="js/sportado-activity.js"></script>

</body>
</html>
