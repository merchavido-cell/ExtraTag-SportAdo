<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SportAdo - History</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            margin: 0; padding: 0; width: 100%; min-height: 100vh;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
            background: #0f172a; color: #f8fafc; overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        .app {
            min-height: 100vh; display: flex; flex-direction: column;
            padding: 18px 18px 0 18px;
            padding-top: calc(18px + env(safe-area-inset-top, 0px));
        }
        .top-bar {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 22px; min-height: 44px;
        }
        .back-btn {
            background: transparent; border: none; color: #94a3b8;
            font-size: 20px; cursor: pointer; padding: 6px 12px;
            border-radius: 8px; font-family: inherit;
        }
        .back-btn:active { background: #1e293b; color: #f8fafc; }
        .page-title {
            font-size: 17px; font-weight: 700; color: #f8fafc;
            letter-spacing: 0.4px;
        }
        .refresh-btn {
            background: transparent; border: 1px solid #334155;
            color: #94a3b8; padding: 6px 12px; border-radius: 8px;
            font-size: 12px; font-weight: 600; cursor: pointer;
            font-family: inherit;
        }
        .refresh-btn:active { background: #1e293b; }

        .main { flex: 1; max-width: 560px; width: 100%; margin: 0 auto; padding-bottom: 20px; }

        .empty-state { text-align: center; padding: 60px 20px; color: #64748b; }
        .empty-icon { font-size: 48px; opacity: 0.3; margin-bottom: 12px; }
        .empty-text { font-size: 14px; line-height: 1.6; }

        .loading { text-align: center; padding: 40px; color: #94a3b8; font-size: 14px; }

        .activity-card {
            display: flex; align-items: center; gap: 14px;
            background: linear-gradient(160deg, #1e293b 0%, #172033 100%);
            border: 1px solid #1e293b; border-radius: 16px;
            padding: 16px; margin-bottom: 10px;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }
        .activity-card:active { transform: scale(0.98); border-color: #334155; }

        .activity-icon {
            width: 46px; height: 46px; border-radius: 12px;
            background: #0f172a; display: flex; align-items: center;
            justify-content: center; font-size: 22px; flex-shrink: 0;
            border: 1px solid #334155;
        }

        .activity-info { flex: 1; min-width: 0; }
        .activity-name {
            font-size: 14px; font-weight: 600; color: #f8fafc;
            margin-bottom: 4px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .activity-meta {
            font-size: 12px; color: #64748b;
            display: flex; gap: 10px; align-items: center;
        }

        .activity-delete {
            background: transparent; border: none;
            color: #475569; font-size: 18px; cursor: pointer;
            padding: 8px; border-radius: 8px; flex-shrink: 0;
        }
        .activity-delete:active { color: #f87171; background: rgba(239, 68, 68, 0.1); }

        .toast {
            position: fixed; bottom: 100px; left: 50%;
            transform: translateX(-50%);
            background: #1e293b; color: #f8fafc;
            padding: 12px 20px; border-radius: 10px;
            border: 1px solid #334155; font-size: 13px;
            z-index: 9999; display: none; max-width: 85%;
            text-align: center;
        }

        .safe-spacer { height: env(safe-area-inset-bottom, 12px); min-height: 12px; }
    </style>
</head>
<body>

<div class="app">
    <header class="top-bar">
        <button class="back-btn" onclick="goBack()">←</button>
        <span class="page-title">History</span>
        <button class="refresh-btn" onclick="loadActivities()">Refresh</button>
    </header>

    <main class="main" id="mainContent">
        <div class="loading">Loading activities...</div>
    </main>

    <div class="safe-spacer"></div>
</div>

<div class="toast" id="toast"></div>

<script src="js/sportado-bridge.js"></script>
<script>
const sportIcons = {
    run: '🏃', bike: '🚴', walk: '🚶',
    duathlon: '🏃‍♂️🚴', navigate: '🧭', strength: '🏋️'
};

function goBack() {
    window.pywebview.api.navigate_to('home.html', 'SportAdo - Home');
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.display = 'none'; }, 2500);
}

function formatSize(bytes) {
    if (!bytes) return '';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1024 / 1024).toFixed(1) + ' MB';
}

function extractSportFromName(fname) {
    const lower = (fname || '').toLowerCase();
    for (const key of ['run', 'bike', 'walk', 'duathlon', 'navigate', 'strength']) {
        if (lower.startsWith(key)) return key;
    }
    return 'run';
}

function formatDateFromName(fname) {
    const m = (fname || '').match(/(\d{4})-(\d{2})-(\d{2})_(\d{2})-(\d{2})/);
    if (!m) return '';
    return `${m[3]}/${m[2]}/${m[1]} · ${m[4]}:${m[5]}`;
}

// >>> מתוקן: שומר את ה-HTML ב-sessionStorage ומנווט ל-activity-view.html <<<
async function openActivity(fileName) {
    try {
        const res = await window.pywebview.api.open_activity_file(fileName);
        const parsed = typeof res === 'string' ? JSON.parse(res) : res;
        if (!parsed || !parsed.success || !parsed.html) {
            showToast('Cannot open file');
            return;
        }

        try {
            sessionStorage.setItem('sportado_view_html', parsed.html);
            sessionStorage.setItem('sportado_view_name', fileName);
        } catch (storageErr) {
            showToast('File too large to display');
            return;
        }

        window.pywebview.api.navigate_to('activity-view.html', 'SportAdo - View');
    } catch (e) {
        showToast('Error: ' + e.message);
    }
}

async function deleteActivity(fileName, ev) {
    if (ev) ev.stopPropagation();
    if (!confirm('Delete this activity?')) return;

    try {
        const res = await window.pywebview.api.delete_activity_file(fileName);
        const parsed = typeof res === 'string' ? JSON.parse(res) : res;
        if (parsed && parsed.success) {
            showToast('Deleted');
            loadActivities();
        } else {
            showToast('Delete failed: ' + (parsed && parsed.error || 'unknown'));
        }
    } catch (e) {
        showToast('Error: ' + e.message);
    }
}

async function loadActivities() {
    const main = document.getElementById('mainContent');
    main.innerHTML = '<div class="loading">Loading activities...</div>';

    try {
        const res = await window.pywebview.api.get_app_activities();
        const parsed = typeof res === 'string' ? JSON.parse(res) : res;

        if (!parsed || !parsed.success) {
            main.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">' +
                (parsed && parsed.error || 'Could not load activities') + '</div></div>';
            return;
        }

        const activities = parsed.activities || [];
        if (activities.length === 0) {
            main.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">' +
                'No activities yet.<br>Start a new activity from the home screen.</div></div>';
            return;
        }

        main.innerHTML = '';
        activities.forEach(a => {
            const sport = extractSportFromName(a.file_name);
            const icon = sportIcons[sport] || '🏃';
            const dateStr = formatDateFromName(a.file_name);
            const sizeStr = formatSize(a.file_size);

            const card = document.createElement('div');
            card.className = 'activity-card';
            card.onclick = () => openActivity(a.file_name);
            card.innerHTML = `
                <div class="activity-icon">${icon}</div>
                <div class="activity-info">
                    <div class="activity-name">${a.file_name}</div>
                    <div class="activity-meta">
                        ${dateStr ? '<span>' + dateStr + '</span>' : ''}
                        ${sizeStr ? '<span>' + sizeStr + '</span>' : ''}
                    </div>
                </div>
                <button class="activity-delete" title="Delete">🗑</button>
            `;
            card.querySelector('.activity-delete').onclick = (ev) => deleteActivity(a.file_name, ev);
            main.appendChild(card);
        });

    } catch (e) {
        main.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">Error: ' +
            e.message + '</div></div>';
    }
}

if (window.pywebview && window.pywebview.api) {
    loadActivities();
} else {
    window.addEventListener('pywebviewready', loadActivities);
}
</script>

</body>
</html>
